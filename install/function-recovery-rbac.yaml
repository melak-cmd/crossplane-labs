apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: function-recovery-cluster-delete
rules:
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  verbs:
  - get
  - patch
  - create
  - update
  - delete
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - create
  - update
- apiGroups:
  - kaonix.com
  - database.kaonix.inc.fr
  resources:
  - postgresqls
  verbs:
  - get
  - patch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: function-recovery
  namespace: crossplane-system
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: function-recovery-runtime
spec:
  deploymentTemplate:
    spec:
      selector:
        matchLabels:
          runtime: function-recovery
      template:
        metadata:
          labels:
            runtime: function-recovery
        spec:
          serviceAccountName: function-recovery
          containers:
          - name: package-runtime
            args:
            - --debug
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: function-recovery-cluster-delete
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: function-recovery-cluster-delete
subjects:
- kind: ServiceAccount
  name: function-recovery
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-operation-database-access
rules:
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  verbs:
  - get
  - create
  - update
  - patch
