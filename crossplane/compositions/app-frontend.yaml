apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  labels:
    type: frontend
  name: app-frontend
spec:
  compositeTypeRef:
    apiVersion: kaonix.com/v1alpha1
    kind: App
  mode: Pipeline
  pipeline:
  - step: render-templates
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      options:
        - missingkey=error
      inline:
        template: |
          {{ $id := .observed.composite.resource.spec.id }}
          {{ $namespace := .observed.composite.resource.spec.parameters.namespace }}
          {{ $image := .observed.composite.resource.spec.parameters.image }}
          {{ $port := .observed.composite.resource.spec.parameters.port }}
          {{ $host := .observed.composite.resource.spec.parameters.host }}
          ---
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: ProviderConfig
          metadata:
            name: {{ $id }}
            annotations:
              {{ setResourceNameAnnotation "provider-config" }}
          spec:
            credentials:
              source: InjectedIdentity
          ---
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: {{ $id }}-deployment
            namespace: {{ $namespace }}
            annotations:
              {{ setResourceNameAnnotation "deployment" }}
            labels:
              app: {{ $id }}
          spec:
            forProvider:
              manifest:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: {{ $id }}
                  namespace: {{ $namespace }}
                  labels:
                    app: {{ $id }}
                spec:
                  replicas: 2
                  selector:
                    matchLabels:
                      app: {{ $id }}
                  template:
                    metadata:
                      labels:
                        app: {{ $id }}
                    spec:
                      containers:
                      - name: frontend
                        image: {{ $image }}
                        ports:
                        - containerPort: {{ $port }}
                        livenessProbe:
                          httpGet:
                            path: /
                            port: {{ $port }}
                        readinessProbe:
                          httpGet:
                            path: /
                            port: {{ $port }}
                        resources:
                          limits:
                            cpu: 250m
                            memory: 256Mi
                          requests:
                            cpu: 125m
                            memory: 128Mi
            providerConfigRef:
              kind: ProviderConfig
              name: {{ $id }}
          ---
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: {{ $id }}-service
            namespace: {{ $namespace }}
            annotations:
              {{ setResourceNameAnnotation "service" }}
            labels:
              app: {{ $id }}
          spec:
            forProvider:
              manifest:
                apiVersion: v1
                kind: Service
                metadata:
                  name: {{ $id }}
                  namespace: {{ $namespace }}
                  labels:
                    app: {{ $id }}
                spec:
                  type: ClusterIP
                  selector:
                    app: {{ $id }}
                  ports:
                  - name: http
                    port: {{ $port }}
                    targetPort: {{ $port }}
                    protocol: TCP
            providerConfigRef:
              kind: ProviderConfig
              name: {{ $id }}
          ---
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: {{ $id }}-ingress
            namespace: {{ $namespace }}
            annotations:
              {{ setResourceNameAnnotation "ingress" }}
            labels:
              app: {{ $id }}
          spec:
            forProvider:
              manifest:
                apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: {{ $id }}
                  namespace: {{ $namespace }}
                  labels:
                    app: {{ $id }}
                  annotations:
                    ingress.kubernetes.io/ssl-redirect: "false"
                spec:
                  rules:
                  - host: {{ $host }}
                    http:
                      paths:
                      - path: /
                        pathType: ImplementationSpecific
                        backend:
                          service:
                            name: {{ $id }}
                            port:
                              number: {{ $port }}
            providerConfigRef:
              kind: ProviderConfig
              name: {{ $id }}
          ---
          apiVersion: kubernetes.m.crossplane.io/v1alpha1
          kind: Object
          metadata:
            name: {{ $id }}-hpa
            namespace: {{ $namespace }}
            annotations:
              {{ setResourceNameAnnotation "hpa" }}
            labels:
              app: {{ $id }}
          spec:
            forProvider:
              manifest:
                apiVersion: autoscaling/v1
                kind: HorizontalPodAutoscaler
                metadata:
                  name: {{ $id }}
                  namespace: {{ $namespace }}
                  labels:
                    app: {{ $id }}
                spec:
                  scaleTargetRef:
                    apiVersion: apps/v1
                    kind: Deployment
                    name: {{ $id }}
                  minReplicas: 2
                  maxReplicas: 6
                  targetCPUUtilizationPercentage: 80
            providerConfigRef:
              kind: ProviderConfig
              name: {{ $id }}
          ---
          apiVersion: kaonix.com/v1alpha1
          kind: App
          status:
            host: {{ $host }}
  - step: automatically-detect-ready-composed-resources
    functionRef:
      name: function-auto-ready
