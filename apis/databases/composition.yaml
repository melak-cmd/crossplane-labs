apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  labels:
    type: database
  name: database-cnpg
spec:
  compositeTypeRef:
    apiVersion: database.kaonix.inc.fr/v1alpha1
    kind: PostgreSQL
  mode: Pipeline
  pipeline:
  - step: render-templates
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      options:
        - missingkey=error
      inline:
        template: |
          {{ $id := .observed.composite.resource.spec.id }}
          {{ $namespace := .observed.composite.resource.spec.parameters.namespace }}
          {{ $database := .observed.composite.resource.spec.parameters.database }}
          {{ $version := .observed.composite.resource.spec.parameters.version }}
          {{ $size := .observed.composite.resource.spec.parameters.size }}
          {{ $instances := .observed.composite.resource.spec.parameters.instances }}
          {{ $storageSize := "1Gi" }}
          {{ if index .observed.composite.resource.spec.parameters "storageSize" }}
          {{ $storageSize = .observed.composite.resource.spec.parameters.storageSize }}
          {{ end }}
          {{ $storageClass := "" }}
          {{ if index .observed.composite.resource.spec.parameters "storageClass" }}
          {{ $storageClass = .observed.composite.resource.spec.parameters.storageClass }}
          {{ end }}
          {{ $backup := index .observed.composite.resource.spec.parameters "backup" }}
          {{ $backupSchedule := "" }}
          {{ $snapshotClass := "" }}
          {{ if $backup }}
          {{ $backupSchedule = index $backup "schedule" | default "" }}
          {{ $snapshotClass = index $backup "snapshotClass" | default "" }}
          {{ end }}
          ---
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          metadata:
            name: {{ $id }}
            namespace: {{ $namespace }}
            annotations:
              {{ setResourceNameAnnotation "cluster" }}
          spec:
            instances: {{ $instances }}
            postgresql:
              parameters:
                max_connections: "200"
              pg_hba:
              - host all all 10.244.0.0/16 trust
            bootstrap:
              initdb:
                database: {{ $database }}
                owner: {{ $id }}
            storage:
              size: {{ $storageSize }}
          {{ if $storageClass }}
              storageClass: {{ $storageClass }}
          {{ end }}
          {{ if $backup }}
            backup:
          {{ if $snapshotClass }}
              volumeSnapshot:
                className: {{ $snapshotClass }}
          {{ else }}
              volumeSnapshot: {}
          {{ end }}
          {{ end }}
          {{ if $backup }}
          ---
          apiVersion: postgresql.cnpg.io/v1
          kind: ScheduledBackup
          metadata:
            name: {{ $id }}-backup
            namespace: {{ $namespace }}
            annotations:
              {{ setResourceNameAnnotation "scheduled-backup" }}
              gotemplating.fn.crossplane.io/ready: "True"
          spec:
            schedule: "{{ $backupSchedule }}"
            method: volumeSnapshot
            backupOwnerReference: self
            cluster:
              name: {{ $id }}
          {{ end }}
          ---
          apiVersion: database.kaonix.inc.fr/v1alpha1
          kind: PostgreSQL
          status:
            host: {{ $id }}-rw.{{ $namespace }}.svc
            port: 5432
            dbName: {{ $database }}
            secretName: {{ $id }}-app
          {{ if $backup }}
            backup:
              schedule: "{{ $backupSchedule }}"
              resourceName: {{ $id }}-backup
          {{ $cluster := getComposedResource . "cluster" }}
          {{ $lastBackup := "" }}
          {{ if $cluster }}
          {{ $lastBackup = dig "status" "lastSuccessfulBackupByMethod" "volumeSnapshot" "" $cluster }}
          {{ if not $lastBackup }}
          {{ $lastBackup = dig "status" "lastSuccessfulBackup" "" $cluster }}
          {{ end }}
          {{ end }}
          {{ if $lastBackup }}
              lastSuccessfulBackup: "{{ $lastBackup }}"
          {{ end }}
          {{ end }}
  - step: automatically-detect-ready-composed-resources
    functionRef:
      name: function-auto-ready
