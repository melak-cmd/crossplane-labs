apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databaserestores.database.kaonix.inc.fr
spec:
  group: database.kaonix.inc.fr
  names:
    kind: DatabaseRestore
    listKind: DatabaseRestoreList
    plural: databaserestores
    singular: databaserestore
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: DatabaseRestore requests a one-shot restore for a PostgreSQL XR.
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              backupName:
                description: Name of the CNPG Backup in the target namespace.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: backupName is immutable; create a new DatabaseRestore request to select another backup
              target:
                description: Namespace containing the PostgreSQL XR, CNPG Backup, recovery plan, and restored Cluster.
                properties:
                  namespace:
                    description: Namespace containing the PostgreSQL XR and restore resources.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                    x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: target.namespace is immutable; create a new DatabaseRestore request to select another namespace
                required:
                - namespace
                type: object
            required:
            - backupName
            - target
            type: object
        required:
        - spec