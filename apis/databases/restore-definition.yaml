apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: postgresqlrestores.database.nuagik.sncf.fr
spec:
  group: database.nuagik.sncf.fr
  names:
    kind: PostgreSQLRestore
    listKind: PostgreSQLRestoreList
    plural: postgresqlrestores
    singular: postgresqlrestore
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: PostgreSQLRestore requests a one-shot restore for a PostgreSQL XR.
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              name:
                description: Name of the PostgreSQL resource to restore in this namespace.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: name is immutable; create a new PostgreSQLRestore request to select another PostgreSQL
              backupName:
                description: Name of the CNPG Backup in this namespace.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - rule: self == oldSelf
                  message: backupName is immutable; create a new PostgreSQLRestore request to select another backup
            required:
            - name
            - backupName
            type: object
        required:
        - spec
