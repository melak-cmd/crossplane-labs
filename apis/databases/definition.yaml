apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgresqls.database.kaonix.inc.fr
spec:
  group: database.kaonix.inc.fr
  names:
    categories:
    - crossplane
    kind: PostgreSQL
    plural: postgresqls
  scope: Namespaced
  defaultCompositeDeletePolicy: Background
  defaultCompositionRef:
    name: database-cnpg
  defaultCompositionUpdatePolicy: Automatic
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.host
      name: host
      type: string
    - jsonPath: .status.port
      name: port
      type: integer
    - jsonPath: .status.dbName
      name: db
      type: string
    name: v1alpha1
    referenceable: true
    schema:
      openAPIV3Schema:
        description: Database is the Schema for the Database API.
        properties:
          spec:
            description: DatabaseSpec defines the desired state of Database.
            properties:
              id:
                description: Unique identifier for this database.
                type: string
              parameters:
                properties:
                  backup:
                    description: >
                      Optional volume-snapshot backup configuration. When set, a
                      CloudNativePG ScheduledBackup is created for the cluster.
                    properties:
                      schedule:
                        description: >
                          Cron schedule (including seconds) for automated
                          volume-snapshot backups, e.g. "0 0 2 * * *".
                        type: string
                      snapshotClass:
                        description: >
                          Name of the VolumeSnapshotClass used for snapshots.
                          Defaults to the cluster's default VolumeSnapshotClass
                          when unset.
                        type: string
                    required:
                    - schedule
                    type: object
                  database:
                    default: app
                    description: The name of the database to create.
                    type: string
                  instances:
                    default: 1
                    description: Number of PostgreSQL instances (replicas).
                    type: integer
                  namespace:
                    default: default
                    description: The namespace for the database resources.
                    type: string
                  size:
                    default: small
                    description: >
                      Predefined size preset. Supported values are `small`,
                      `medium`, and `large`.
                    type: string
                  storageSize:
                    description: >
                      Explicit PVC storage size (e.g., 1Gi). Overrides the
                      size preset when set.
                    type: string
                  storageClass:
                    description: >
                      StorageClass for the PostgreSQL PVCs. Required when the
                      Database is backed up via volume snapshots, so the
                      StorageClass provisioner supports snapshots (e.g., a CSI
                      driver). Defaults to the cluster default StorageClass
                      when unset.
                    type: string
                  version:
                    default: "16"
                    description: PostgreSQL major version (e.g., 13, 14, 15, 16).
                    type: string
                required:
                - namespace
                type: object
            required:
            - id
            - parameters
            type: object
          status:
            description: DatabaseStatus defines the observed state of Database.
            properties:
              backup:
                description: Observed backup status when backup is configured.
                properties:
                  lastSuccessfulBackup:
                    description: >
                      Timestamp of the last successful backup reported by
                      CloudNativePG.
                    type: string
                  resourceName:
                    description: Name of the ScheduledBackup resource.
                    type: string
                  schedule:
                    description: Configured backup schedule.
                    type: string
                type: object
              dbName:
                description: Name of the database.
                type: string
              host:
                description: Internal Kubernetes Service address.
                type: string
              port:
                description: PostgreSQL port.
                type: integer
              secretName:
                description: Name of the Secret containing credentials.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
