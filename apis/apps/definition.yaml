apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: apps.kaonix.com
spec:
  scope: Namespaced
  defaultCompositeDeletePolicy: Background
  defaultCompositionRef:
    name: app-frontend
  defaultCompositionUpdatePolicy: Automatic
  group: kaonix.com
  names:
    kind: App
    plural: apps
  versions:
  - name: v1alpha1
    referenceable: true
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              id:
                description: Unique identifier for this application.
                type: string
              parameters:
                properties:
                  namespace:
                    default: default
                    description: The namespace to deploy into.
                    type: string
                  image:
                    description: The container image of the application.
                    type: string
                  port:
                    default: 80
                    description: The application port.
                    type: integer
                required:
                - image
                type: object
            required:
            - id
            - parameters
            type: object
        type: object
    served: true
