apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: networks.kaonix.com
spec:
  scope: Namespaced
  defaultCompositeDeletePolicy: Background
  defaultCompositionRef:
    name: network-fullstack
  defaultCompositionUpdatePolicy: Automatic
  group: kaonix.com
  names:
    kind: Network
    plural: networks
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.serviceName
      name: service
      type: string
    - jsonPath: .status.ingressHost
      name: host
      type: string
    name: v1alpha1
    referenceable: true
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              id:
                description: Unique identifier for this network configuration.
                type: string
              parameters:
                properties:
                  namespace:
                    default: default
                    description: The namespace of the target application.
                    type: string
                  appName:
                    description: The name of the target application (used for selector matching).
                    type: string
                  ports:
                    description: List of port mappings to expose.
                    items:
                      properties:
                        port:
                          description: The port to expose.
                          type: integer
                        protocol:
                          default: TCP
                          description: The protocol (TCP or UDP).
                          type: string
                        targetPort:
                          description: The port on the target pod. Defaults to port.
                          type: integer
                      required:
                      - port
                      type: object
                    type: array
                  ingress:
                    description: Ingress configuration (optional).
                    properties:
                      host:
                        description: The hostname for the Ingress rule.
                        type: string
                      path:
                        default: /
                        description: The path for the Ingress rule.
                        type: string
                      tlsSecret:
                        description: TLS secret name for HTTPS. If empty, no TLS.
                        type: string
                    type: object
                  networkPolicy:
                    description: NetworkPolicy configuration (optional).
                    properties:
                      ingress:
                        description: Allowed ingress sources as CIDR blocks.
                        items:
                          type: string
                        type: array
                      egress:
                        description: Allowed egress destinations as CIDR blocks.
                        items:
                          type: string
                        type: array
                    type: object
                  dns:
                    description: External DNS name (creates an ExternalName service).
                    type: string
                required:
                - appName
                - ports
                type: object
            required:
            - id
            - parameters
            type: object
          status:
            properties:
              serviceName:
                description: The name of the created Service.
                type: string
              ingressHost:
                description: The Ingress host.
                type: string
              networkPolicyName:
                description: The name of the created NetworkPolicy.
                type: string
            type: object
        type: object
    served: true
