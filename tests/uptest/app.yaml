apiVersion: kaonix.com/v1alpha1
kind: App
metadata:
  name: uptest-app
  namespace: platform
  labels:
    app-owner: uptest
  annotations:
    uptest.upbound.io/timeout: "300"
spec:
  id: uptest-app
  crossplane:
    compositionSelector:
      matchLabels:
        type: frontend
  parameters:
    namespace: platform
    image: vfarcic/devops-toolkit-series:4.0.0
    port: 80
---
apiVersion: kaonix.com/v1alpha1
kind: App
metadata:
  name: uptest-app-custom-port
  namespace: platform
  labels:
    app-owner: uptest
  annotations:
    uptest.upbound.io/timeout: "300"
spec:
  id: uptest-app-custom-port
  crossplane:
    compositionSelector:
      matchLabels:
        type: frontend
  parameters:
    namespace: platform
    image: nginx:1.27-alpine
    port: 8080
---
apiVersion: kaonix.com/v1alpha1
kind: Network
metadata:
  name: uptest-network
  namespace: platform
  labels:
    app-owner: uptest
  annotations:
    uptest.upbound.io/timeout: "300"
spec:
  id: uptest-network
  parameters:
    namespace: platform
    appName: uptest-app
    ports:
    - port: 80
      protocol: TCP
    ingress:
      host: uptest-app.127.0.0.1.nip.io
      path: /
---
apiVersion: kaonix.com/v1alpha1
kind: Database
metadata:
  name: uptest-db
  namespace: platform
  labels:
    app-owner: uptest
  annotations:
    uptest.upbound.io/timeout: "300"
spec:
  id: uptest-db
  parameters:
    namespace: platform
    database: uptest
    version: "16"
    size: small
    instances: 1
---
apiVersion: kaonix.com/v1alpha1
kind: Database
metadata:
  name: uptest-db-multi
  namespace: platform
  labels:
    app-owner: uptest
  annotations:
    uptest.upbound.io/timeout: "300"
spec:
  id: uptest-db-multi
  parameters:
    namespace: platform
    database: uptest_multi
    version: "16"
    size: small
    instances: 2
    storageSize: 2Gi
