name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Install tools
        run: |
          set -euo pipefail
          bin_dir="$HOME/.local/bin"
          mkdir -p "$bin_dir"
          echo "$bin_dir" >> "$GITHUB_PATH"

          curl -fsSL \
            https://github.com/crossplane/uptest/releases/download/v2.2.0/uptest_linux-amd64 \
            -o "$bin_dir/uptest" &
          uptest_pid=$!

          curl -fsSL \
            https://github.com/kyverno/chainsaw/releases/download/v0.2.15/chainsaw_linux_amd64.tar.gz \
            -o /tmp/chainsaw.tar.gz &
          chainsaw_pid=$!

          wait "$uptest_pid" "$chainsaw_pid"
          tar -xzf /tmp/chainsaw.tar.gz -C "$bin_dir"
          chmod +x "$bin_dir/uptest" "$bin_dir/chainsaw"

      - name: Create k3d cluster
        run: k3d cluster create crossplane-labs --config clusters/k3d.yaml

      - name: Install Crossplane
        run: |
          helm repo add crossplane-stable https://charts.crossplane.io/stable --force-update
          helm repo update
          helm upgrade --install crossplane crossplane-stable/crossplane \
            --namespace crossplane-system \
            --create-namespace \
            --version 2.3.3 \
            --wait

      - name: Install providers and functions
        run: |
          kubectl apply -f crossplane/providers/
          kubectl apply -f crossplane/functions/

      - name: Run uptest
        run: |
          KUBECTL=kubectl CROSSPLANE_NAMESPACE=crossplane-system \
          CHAINSAW=$(which chainsaw) \
          uptest e2e test/uptest/app.yaml \
            --setup-script test/uptest/setup.sh \
            --default-timeout 300s \
            --skip-import

      - name: Cleanup
        if: always()
        run: k3d cluster delete crossplane-labs
